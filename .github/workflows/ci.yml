name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy networkx pandas matplotlib pytest
          pip install --index-url https://download.pytorch.org/whl/cpu torch || true
      - name: Run unit tests (CPU)
        env:
          PYTHONPATH: src:.
        run: |
          pytest tests/ -q --ignore=tests/test_dataset_loaders.py
      - name: Smoke-test M/M/1 sanity script
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/verify_mm1_limit.py --rhos 0.5 --t-final 200 --output /tmp/mm1.json
          test -s /tmp/mm1.json

  paper-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-science \
            texlive-fonts-recommended texlive-bibtex-extra latexmk
      - name: Build Cluster Computing paper
        run: |
          cd paper/cluster_computing
          latexmk -pdf -interaction=nonstopmode -bibtex main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-computing-pdf
          path: paper/cluster_computing/main.pdf
